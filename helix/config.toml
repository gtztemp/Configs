theme = "monokai"

[editor]
line-number = "relative"
mouse = true
cursorline = true
bufferline = "multiple"
color-modes = true
true-color = true
undercurl = true

# Format supported files when saving
auto-format = true

# Show diagnostics at the end of lines
end-of-line-diagnostics = "hint"

# Start completion after one character
completion-trigger-len = 1

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "│"

[editor.statusline]
left = ["mode", "spinner", "version-control"]
center = ["file-name"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]

[editor.file-picker]
hidden = false
git-ignore = true
max-depth = 5

[editor.lsp]
display-messages = true
display-progress-messages = true
display-inlay-hints = true

#[editor.auto-save]
#focus-lost = true

[editor.soft-wrap]
enable = true

[editor.inline-diagnostics]
cursor-line = "warning"
